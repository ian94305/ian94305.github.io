<svg xmlns="http://www.w3.org/2000/svg" width="530" height="424" viewBox="0 0 530 424" role="img" aria-labelledby="title desc">
<title id="title">名額競爭測試的知識圖譜</title>
<desc id="desc">六個節點節錄自 Graphify 範例。測試筆記明確引用測試任務，任務與名額一致性需求之間的虛線是待人工審核的推論。</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".85" fill="#475772" opacity=".42"/></pattern></defs>
<style>text{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}.label{paint-order:stroke;stroke:#121c2e;stroke-width:6;stroke-linejoin:round}</style>
<rect width="530" height="424" fill="#121c2e"/><rect width="530" height="424" fill="url(#dots)"/>
<text x="18" y="26" font-size="11" letter-spacing="2" fill="#b4bfd0">GRAPHIFY  /  01</text>
<path d="M427 112 L265 180" fill="none" stroke="#74849b" stroke-width="2"/>
<path d="M95 90 L265 180" fill="none" stroke="#74849b" stroke-width="2"/>
<path d="M265 60 L265 180" fill="none" stroke="#74849b" stroke-width="2"/>
<path d="M265 284 L100 350" fill="none" stroke="#74849b" stroke-width="2"/>
<path d="M265 180 L265 284" fill="none" stroke="#f3b755" stroke-dasharray="6 6" stroke-width="2"/>
<circle cx="427" cy="112" r="5" fill="#bfcfe2"/><text class="label" x="427" y="140" text-anchor="middle" font-size="16" fill="#edf2f8">以請求識別碼處理重試</text>
<circle cx="95" cy="90" r="5" fill="#bfcfe2"/><text class="label" x="95" y="118" text-anchor="middle" font-size="16" fill="#edf2f8">重複提交保護</text>
<circle cx="265" cy="60" r="5" fill="#bfcfe2"/><text class="label" x="265" y="88" text-anchor="middle" font-size="16" fill="#edf2f8">競爭條件測試筆記</text>
<circle cx="265" cy="284" r="12" fill="#121c2e" stroke="#f3b755" stroke-opacity=".48"/>
<circle cx="265" cy="284" r="5" fill="#f3b755"/><text class="label" x="265" y="312" text-anchor="middle" font-size="16" fill="#edf2f8">名額一致性</text>
<circle cx="100" cy="350" r="5" fill="#bfcfe2"/><text class="label" x="100" y="378" text-anchor="middle" font-size="16" fill="#edf2f8">完成場次與名額資料模型</text>
<circle cx="265" cy="180" r="12" fill="#121c2e" stroke="#f3b755" stroke-opacity=".48"/>
<circle cx="265" cy="180" r="5" fill="#f3b755"/><text class="label" x="265" y="208" text-anchor="middle" font-size="16" fill="#edf2f8">測試重複送出與名額競爭</text>
<path d="M23 399h27" stroke="#74849b" stroke-width="2"/>
<text x="58" y="404" font-size="15" fill="#ced7e5">文件明確引用</text>
<path d="M244 399h27" stroke="#f3b755" stroke-width="2" stroke-dasharray="5 4"/>
<text x="279" y="404" font-size="15" fill="#f3b755">語意推論・待審</text></svg>